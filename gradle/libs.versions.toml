[versions]
activityCompose = "1.10.1"
haze = "1.6.6"
kotlin = "2.4.0"
ksp = "2.3.10"
compose = "1.11.1"
androidGradlePlugin = "8.13.2"
androidBuildTools = "31.7.2"
highlights = "1.0.0"
kotlinx-datetime = "0.7.1"
buildKonfig = "0.17.1"
mavenPublish = "0.33.0"
hot-reload = "1.1.1"
nucleus = "dev"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-test-junit = "androidx.test.ext:junit:1.2.1"

haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }

kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
ktor-client-java = "io.ktor:ktor-client-java:3.0.0"
jsoup = "org.jsoup:jsoup:1.16.2"
google-guava = "com.google.guava:guava:33.2.1-jre"
squareup-kotlinpoet = "com.squareup:kotlinpoet:2.1.0"
android-tools-common = { module = "com.android.tools:common", version.ref = "androidBuildTools" }
android-tools-sdk-common = { module = "com.android.tools:sdk-common", version.ref = "androidBuildTools" }
highlights = { module = "dev.snipme:highlights", version.ref = "highlights" }
nucleus-application = { module = "dev.nucleusframework:nucleus.nucleus-application", version.ref = "nucleus" }
nucleus-window-tao = { module = "dev.nucleusframework:nucleus.decorated-window-tao", version.ref = "nucleus" }
nucleus-core-runtime = { module = "dev.nucleusframework:nucleus.core-runtime", version.ref = "nucleus" }
nucleus-graalvm-runtime = { module = "dev.nucleusframework:nucleus.graalvm-runtime", version.ref = "nucleus" }
nucleus-darkmode-detector = { module = "dev.nucleusframework:nucleus.darkmode-detector", version.ref = "nucleus" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

compose = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-hotReload = { id = "org.jetbrains.compose.hot-reload", version.ref = "hot-reload" }

android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradlePlugin" }

build-konfig = { id = "com.codingfeline.buildkonfig", version.ref = "buildKonfig" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }