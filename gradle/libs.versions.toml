[versions]
activityCompose = "1.13.0"
haze = "1.7.2"
kotlin = "2.4.10"
ksp = "2.3.10"
compose = "1.11.1"
androidGradlePlugin = "8.13.2"
androidBuildTools = "32.3.1"
highlights = "1.1.0"
kotlinx-datetime = "0.8.0"
buildKonfig = "0.22.0"
mavenPublish = "0.37.0"
hot-reload = "1.1.1"
nucleus = "2.2.0"
# Keep in lockstep with Kotlin (see skydoves/compose-stability-analyzer Kotlin mapping).
stability-analyzer = "0.12.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-test-junit = "androidx.test.ext:junit:1.3.0"

haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }

kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
ktor-client-java = "io.ktor:ktor-client-java:3.5.2"
jsoup = "org.jsoup:jsoup:1.23.1"
google-guava = "com.google.guava:guava:33.6.0-jre"
squareup-kotlinpoet = "com.squareup:kotlinpoet:2.3.0"
android-tools-common = { module = "com.android.tools:common", version.ref = "androidBuildTools" }
android-tools-sdk-common = { module = "com.android.tools:sdk-common", version.ref = "androidBuildTools" }
highlights = { module = "dev.snipme:highlights", version.ref = "highlights" }
nucleus-application = { module = "dev.nucleusframework:nucleus.nucleus-application", version.ref = "nucleus" }
nucleus-window-tao = { module = "dev.nucleusframework:nucleus.decorated-window-tao", version.ref = "nucleus" }
nucleus-core-runtime = { module = "dev.nucleusframework:nucleus.core-runtime", version.ref = "nucleus" }
nucleus-graalvm-runtime = { module = "dev.nucleusframework:nucleus.graalvm-runtime", version.ref = "nucleus" }
nucleus-darkmode-detector = { module = "dev.nucleusframework:nucleus.darkmode-detector", version.ref = "nucleus" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

compose = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-hotReload = { id = "org.jetbrains.compose.hot-reload", version.ref = "hot-reload" }

android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradlePlugin" }

build-konfig = { id = "com.codingfeline.buildkonfig", version.ref = "buildKonfig" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
stability-analyzer = { id = "com.github.skydoves.compose.stability.analyzer", version.ref = "stability-analyzer" }