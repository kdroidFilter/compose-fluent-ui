name: Publish to Maven Central

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-maven-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish libraries
    # macOS is required: the library modules declare Apple targets, whose klibs
    # can only be built (and therefore published) on a Mac.
    runs-on: macos-latest
    timeout-minutes: 90

    env:
      # Consumed by the build plugin to derive the published version.
      RELEASE_VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The build plugin runs `git describe --tags` to derive the gallery
          # version; a shallow clone has no tags.
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve published version
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Refusing to publish from ref '$RELEASE_VERSION': expected a vX.Y.Z[-suffix] tag." >&2
            exit 1
          fi
          echo "Publishing dev.nucleusframework.composefluent:* version $VERSION"

      - name: Publish
        # The vanniktech publish tasks are not configuration-cache compatible.
        run: ./gradlew publishAndReleaseToMavenCentral --no-daemon --no-configuration-cache --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVENCENTRALPASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNINGINMEMORYKEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNINGKEYID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNINGPASSWORD }}
